# Ontology over the exposome / EHR vocabulary.
#
# The evidence graph runs from exposures to outcomes, and from both to the
# data and methods they were observed through. The questions its links answer
# are in docs/COMPETENCY_QUESTIONS.md.
#
# Two kinds of edge live here:
#
#   1. Taxonomy (`is_a`, provenance 'taxonomy'): what kind of thing each topic
#      is. Hand-maintained below. Structure, not a literature claim.
#
#   2. Literature links (every other predicate): generated from the quoted
#      claims in config/relation_excerpts.yaml by scripts/build_relations.py.
#      Do not edit that block by hand. Provenance names the papers whose
#      passages back the link.
#
# Predicates. `domain` and `range` are facet groups (or class kinds); they limit
# which ordered pairs the decision models are offered, and nothing else.
# `option` is the stage-3 answer text and `statement` the stage-4 template, so
# the questions are defined here, next to the predicates they ask about.
#
#   is_a               - what kind of thing a topic is. Transitive.
#   risk_factor_for    - the paper reports that the exposure is associated with
#                        more of, or a higher risk of, the outcome.
#   protective_for     - the paper reports that the exposure is associated with
#                        less of, or a lower risk of, the outcome.
#   no_association_with- the paper reports no association between the exposure
#                        and the outcome. Null results are kept: an evidence
#                        map without them over-states every exposure.
#   assessed_by        - how the exposure was assigned to people.
#   ascertained_from   - which data source the outcome or exposure was taken
#                        from (e.g. asthma from EHR diagnosis codes).
#   linked_with        - two data sources (or a data source and an exposure
#                        model) joined at the individual level. Symmetric.

predicates:
  is_a:                {transitive: true,  subsumption: true,  inverse: subsumes}
  risk_factor_for:
    transitive: false
    subsumption: false
    inverse: has_risk_factor
    domain: [exposure]
    range: [outcome]
    option: 'an exposure associated with more of, or a higher risk of, an outcome'
    statement: '{a} is associated with more {b} or a higher risk of {b}'
  protective_for:
    transitive: false
    subsumption: false
    inverse: has_protective_factor
    domain: [exposure]
    range: [outcome]
    option: 'an exposure associated with less of, or a lower risk of, an outcome'
    statement: '{a} is associated with less {b} or a lower risk of {b}'
  no_association_with:
    transitive: false
    subsumption: false
    inverse: no_association_with
    symmetric: false
    domain: [exposure]
    range: [outcome]
    option: 'an exposure found not to be associated with an outcome'
    statement: '{a} was not associated with {b}'
  assessed_by:
    transitive: false
    subsumption: false
    inverse: assesses
    domain: [exposure]
    range: [assessment]
    option: 'how an exposure was measured or assigned'
    statement: '{a} was measured or assigned by {b}'
  ascertained_from:
    transitive: false
    subsumption: false
    inverse: source_of
    domain: [outcome, exposure]
    range: [data_source]
    option: 'the data source an outcome or exposure was taken from'
    statement: '{a} was identified or taken from {b}'
  linked_with:
    transitive: false
    subsumption: false
    inverse: linked_with
    symmetric: true
    domain: [data_source, assessment]
    range: [data_source, assessment]
    option: 'two data sources joined person by person, or by address'
    statement: '{a} was linked to {b}'

# Abstract nodes. Nothing is harvested for them; they exist so the taxonomy can
# group facets, and so OMOP domains can be read off a facet's ancestors.
