[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposome-ehr"
version = "0.1.0"
description = "Harvest, structure and read the PubMed literature on the exposome in routinely collected health data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
exposome-ehr = "exposome_ehr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: hits a live external API"]
addopts = "-q"
