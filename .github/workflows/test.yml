name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: mac-mini.tail5aee49.ts.net

      - name: Verify LLM endpoint
        run: |
          curl -sf --max-time 15 https://mac-mini.tail5aee49.ts.net/v1/models
          echo ""
          echo "Endpoint is reachable."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openai pypdf pydantic python-dotenv pytest tinydb dagster

      - name: Run tests
        run: pytest tests/ -q
