name: Run pipeline

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Concurrent summarizer / data-availability workers"
        default: "4"
        required: false
      limit:
        description: "Pilot run: only process the first N papers (blank = all)"
        default: ""
        required: false
      force:
        description: "Re-extract every paper instead of only the missing ones"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openai pypdf pydantic python-dotenv pytest tinydb dagster

      - name: Run tests
        env:
          GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
        run: pytest tests/ -q

      - name: Materialize pipeline (download -> summarize -> data availability -> results)
        env:
          GEMMA_API_KEY: ${{ secrets.GEMMA_API_KEY }}
          # Pinned, not read from a repo variable: this is the only endpoint the
          # pipeline talks to, and a stale vars.GEMMA_BASE_URL silently
          # redirected the run to an unreachable host.
          GEMMA_BASE_URL: https://llm.bioinfolder.com/v1
          GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
          SUMMARIZE_WORKERS: ${{ inputs.workers }}
          SCAN_WORKERS: ${{ inputs.workers }}
          PIPELINE_LIMIT: ${{ inputs.limit }}
          SUMMARIZE_FORCE: ${{ inputs.force }}
        run: dagster asset materialize -m pipeline --select "*"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers results paper_summary.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update pipeline outputs ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # The materialize step runs for a long time, so the branch may have
          # moved on while it worked. A plain push is then rejected as
          # non-fast-forward and the whole run fails after all the LLM spend —
          # rebase onto the current tip and retry instead.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Pushed pipeline outputs (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/${{ github.ref_name }}."
            git fetch origin ${{ github.ref_name }}
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push pipeline outputs after 3 attempts."
          exit 1
